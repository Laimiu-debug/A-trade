<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A-trade · 正在启动</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'Microsoft YaHei UI','Segoe UI',sans-serif;color:#172333;background:#F5F7FB}
    body{display:grid;place-items:center}.titlebar{position:absolute;inset:0 0 auto;height:46px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;-webkit-app-region:drag;color:#59677A;font-size:13px}
    button{border:0;border-radius:7px;background:transparent;color:#59677A;font:inherit;padding:7px 13px;cursor:pointer;-webkit-app-region:no-drag;transition:background-color 140ms cubic-bezier(.22,1,.36,1),color 140ms cubic-bezier(.22,1,.36,1),transform 90ms cubic-bezier(.22,1,.36,1)}button:hover{background:#EEF3FF;color:#2457E5}button:active{transform:scale(.975)}button:focus-visible{outline:2px solid #2457E5;outline-offset:2px}
    main{width:min(440px,80vw);text-align:center;animation:startup-in 260ms cubic-bezier(.22,1,.36,1) both}img{width:60px;height:60px}h1{font-size:28px;letter-spacing:.5px;margin:20px 0 12px;font-weight:650}p{font-size:14px;color:#59677A;line-height:1.8;margin:0}
    .track{height:4px;margin:28px auto 0;width:224px;background:#DFE8F3;overflow:hidden;border-radius:8px}.track span{display:block;height:100%;width:38%;background:#2457E5;border-radius:8px;animation:loading 1.4s ease-in-out infinite}
    @keyframes startup-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes loading{from{transform:translateX(-110%)}to{transform:translateX(370%)}}@media(prefers-reduced-motion:reduce){main{animation:none}.track span{animation:none;width:100%}}
  </style>
</head>
<body>
  <div class="titlebar"><span>A-trade</span><button type="button" aria-label="取消启动并关闭">关闭</button></div>
  <main aria-busy="true"><img src="../preview/assets/app-mark.svg" alt=""><h1>A-trade</h1><p role="status">正在读取本地工作区，请稍候…</p><div class="track" aria-hidden="true"><span></span></div></main>
  <script src="startup.js"></script>
</body>
</html>
